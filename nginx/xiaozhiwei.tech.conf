# Nginx configuration for xiaozhiwei.tech
# Place this file at: /etc/nginx/sites-available/xiaozhiwei.tech
# Then symlink: ln -s /etc/nginx/sites-available/xiaozhiwei.tech /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name xiaozhiwei.tech www.xiaozhiwei.tech;

    root /var/www/xiaozhiwei.tech;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets with long cache (fingerprinted files in _astro/)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon & robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # SPA-like fallback for Astro pages
    # Astro generates clean URLs with index.html in subdirectories
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Custom 404 page (if you create one)
    error_page 404 /404.html;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
