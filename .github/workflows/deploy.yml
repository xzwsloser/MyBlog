name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/about/index.html
          test -s dist/archives/index.html
          test -s dist/tags/index.html
          test -s dist/search/index.html
          test -s dist/favicon.ico
          test -s dist/img/favicon-32x32.png
          test -s dist/img/deepseek.jpg
          test -s dist/deepseek-pet/deepseek-pet.css
          test -s dist/deepseek-pet/deepseek-pet.js
          test -s dist/deepseek-pet/img/idle.webp
          grep -q 'favicon.ico' dist/index.html
          grep -q 'deepseek-pet/deepseek-pet.js' dist/index.html
          grep -q 'deepseek-pet/deepseek-pet.js' dist/about/index.html
          echo "Built $(find dist -type f | wc -l) files."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://xiaozhiwei.tech
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Validate deployment secrets
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_TARGET: ${{ secrets.REMOTE_TARGET }}
        run: |
          set -euo pipefail
          missing=0
          for name in REMOTE_HOST REMOTE_USER SSH_PRIVATE_KEY REMOTE_TARGET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/*'
          target: ${{ secrets.REMOTE_TARGET }}
          strip_components: 1
          command_timeout: 10m
          rm: true

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            nginx -t
            systemctl reload nginx

      - name: Deployment summary
        shell: bash
        run: |
          echo "Deployed ${GITHUB_SHA::7} to production." >> "$GITHUB_STEP_SUMMARY"
